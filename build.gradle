plugins {
    id 'java-library'
    id 'maven-publish'
    id 'com.diffplug.spotless' version '8.10.2'
}

group = 'kg.aidarbek'
version = '0.1.0-rc.1'
description = 'A lightweight Java SMPP library'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'Lightweight SMPP'
                description = project.description
                licenses {
                    license {
                        name = 'Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        distribution = 'repo'
                    }
                }
            }
        }
    }
}

sourceSets {
    examples {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    test {
        compileClasspath += sourceSets.examples.output
        runtimeClasspath += sourceSets.examples.output
    }
    review
    reviewTest {
        compileClasspath += sourceSets.review.output
        runtimeClasspath += sourceSets.review.output
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.tngtech.archunit:archunit:1.4.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    reviewTestImplementation platform('org.junit:junit-bom:6.0.0')
    reviewTestImplementation 'org.junit.jupiter:junit-jupiter'
    reviewTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.register('runExampleClient', JavaExec) {
    group = 'application'
    description = 'Runs the loopback bind/enquiry/unbind client example.'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    classpath = sourceSets.examples.runtimeClasspath
    mainClass = 'kg.aidarbek.examples.ExampleClient'
}

tasks.register('runExampleServer', JavaExec) {
    group = 'application'
    description = 'Runs the finite loopback server with demo-only credentials.'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    classpath = sourceSets.examples.runtimeClasspath
    mainClass = 'kg.aidarbek.examples.ExampleServer'
}

tasks.register('reviewTest', Test) {
    description = 'Tests the development-only SOLID review validator.'
    group = 'verification'
    testClassesDirs = sourceSets.reviewTest.output.classesDirs
    classpath = sourceSets.reviewTest.runtimeClasspath
}

def reviewSourceFiles = fileTree(projectDir) {
    include '**/*.java'
    exclude 'build/**', 'simulator/build/**', '**/.git/**', '**/.gradle/**'
}
def reviewDocumentFiles = fileTree('docs/reviews') {
    include '**/*.md'
}
def reviewLauncher = javaToolchains.launcherFor(java.toolchain)

['solidReview': false, 'solidReviewInventory': true].each { taskName, inventoryOnly ->
    def reviewArguments = objects.newInstance(SolidReviewArguments)
    reviewArguments.repositoryDirectory.set(layout.projectDirectory)
    reviewArguments.javaSources.from(reviewSourceFiles)
    reviewArguments.reviewDocuments.from(inventoryOnly ? files() : reviewDocumentFiles)
    reviewArguments.inventoryOnly.set(inventoryOnly)
    reviewArguments.outputFile.set(layout.buildDirectory.file(
            inventoryOnly ? 'reports/solid-review/types.tsv' : 'reports/solid-review/coverage.tsv'))

    tasks.register(taskName, JavaExec) {
        description = inventoryOnly ? 'Lists every current Java type and source hash.'
                : 'Checks current SOLID review evidence for every project-owned Java type.'
        group = 'verification'
        javaLauncher = reviewLauncher
        classpath = sourceSets.review.runtimeClasspath
        mainClass = 'kg.aidarbek.smpp.review.ReviewCheck'
        workingDir = layout.projectDirectory
        argumentProviders.add(reviewArguments)
        inputs.files('docs/SOLID.md', 'docs/REVIEW_FORMAT.md')
                .withPropertyName('reviewPolicy').withPathSensitivity(PathSensitivity.RELATIVE)
        outputs.file(reviewArguments.outputFile)
        // Exact consumed files, policy, launcher, mode and tool classpath are tracked;
        // the output contains only sorted relative paths, type identities and hashes.
        outputs.cacheIf('Deterministic review result with all consumed inputs declared') { true }
    }
}

tasks.named('check') {
    dependsOn 'reviewTest', 'solidReview', ':simulator:check'
}

abstract class SolidReviewArguments implements CommandLineArgumentProvider {
    @Internal
    abstract DirectoryProperty getRepositoryDirectory()

    @InputFiles
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getJavaSources()

    @InputFiles
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getReviewDocuments()

    @Input
    abstract Property<Boolean> getInventoryOnly()

    @Internal
    abstract RegularFileProperty getOutputFile()

    @Override
    Iterable<String> asArguments() {
        def root = repositoryDirectory.get().asFile.toPath()
        def relative = { File file -> root.relativize(file.toPath()).toString().replace(File.separator, '/') }
        def result = [inventoryOnly.get() ? '--inventory-files' : '--check-files', '.', relative(outputFile.get().asFile)]
        javaSources.files.sort().each { file -> result.addAll(['--source', relative(file)]) }
        reviewDocuments.files.sort().each { file -> result.addAll(['--report', relative(file)]) }
        return result
    }
}

spotless {
    java {
        target 'src/*/java/**/*.java', 'simulator/src/*/java/**/*.java'
        encoding 'UTF-8'
        lineEndings = com.diffplug.spotless.LineEnding.UNIX
        palantirJavaFormat('2.96.0')
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs.addAll(['-Xlint:all', '-Werror'])
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.docEncoding = 'UTF-8'
    options.charSet = 'UTF-8'
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.withType(Jar).configureEach {
    from(['LICENSE', 'NOTICE']) {
        into 'META-INF'
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat = 'full'
    }
}

tasks.named('build') {
    dependsOn ':simulator:build'
}
