# Reuse outputs of cacheable tasks and the configured task graph.
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=fail

# Keep the JVM and file-system snapshots available between local builds.
org.gradle.daemon=true
org.gradle.vfs.watch=true

# Allow independent projects to execute in parallel if the build grows.
org.gradle.parallel=true
